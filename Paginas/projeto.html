<!DOCTYPE html>
<html lang = "pt-BR">
<head>
    <meta charset = "UTF-8">
    <meta name = "viewport" content = "width = device-width, initial-scale = 1.0">
    <title>Cadastro de Projeto</title>
    <link rel = "stylesheet" href = "../styles.css">
</head>
<body>
<form>
    <input type = "hidden" id = "cod_edicao">
    <input type = "text" id = "nome" placeholder = "Nome">
    <input type = "text" id = "descricao" placeholder = "Descrição">
    <input type = "date" id = "data_inicio">
    <input type = "date" id = "data_fim">
    <input type = "text" id = "responsavel" placeholder = "Responsável">
    <input type = "button" id = "btn-cadastrar" onclick = "cadastrarProjeto()" value = "Cadastrar">
    <input type = "button" id = "btn-atualizar" onclick = "atualizarProjeto()" value = "Atualizar"
    style = "display:none">
    <input type = "reset"  value = "Limpar">
</form>

<div id = "mensagem-retorno"></div>

<h2>Pesquisar Projetos</h2>
    
<input type = "text" id = "campo-pesquisa" placeholder = "Digite para pesquisar...">
<input type = "button" onclick = "pesquisarProjeto()" value = "Pesquisar">
 
<div>
    <table id = "resultado" border = "1" style = "margin-top: 10px; width: 300px;">
        <thead>
            <tr>
                <th>Código</th>
                <th>Nome</th>
                <th>Responsável</th>
                <th>Início</th>
                <th>Fim</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id = "resultadobody"></tbody>
    </table>
</div>

<a href = "../index.html">Voltar</a>

<script src = "../script.js"></script>
<script>
    window.onload = function(){
    pesquisarProjeto();
    };
</script>
</body>
</html>
