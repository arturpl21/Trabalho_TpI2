<!DOCTYPE html>
<html lang = "pt-BR">
<head>
    <meta charset = "UTF-8">
    <meta name = "viewport" content = "width = device-width, initial-scale = 1.0">
    <title>Cadastro de Usuário</title>
    <link rel = "stylesheet" href = "../styles.css">
</head>
<body>
 <h1>Cadastro de Usuário</h1>

<form>
    <input type = "hidden" id = "cod_edicao">
    <input type = "text" id = "nome" placeholder = "Nome" required>
    <input type = "email" id = "email" placeholder = "Email" required>
    <input type = "password" id = "senha" placeholder = "Senha">
    <input type = "password" id = "senha_confirmacao" placeholder = "Confirmar Senha">
    <input type = "number" id = "idade" placeholder = "Idade">
    <input type = "button" id = "btn-cadastrar" onclick = "cadastrarUsuario()" value = "Cadastrar">
    <input type = "button" id = "btn-atualizar" onclick = "atualizarUsuario()" value = "Atualizar"
    style = "display:none">
    <input type = "reset" value = "Limpar">
</form>

<div id = "mensagem-retorno"></div>

<h2>Pesquisar Usuários</h2>
    
<input type = "text" id = "campo-pesquisa" placeholder = "Digite para pesquisar...">
<input type = "button" onclick = "pesquisarUsuario()" value = "Pesquisar">
 
<div>
    <table id = "resultado" border = "1" style = "margin-top: 10px; width: 300px;">
        <thead>
            <tr>
                <th>Código</th>
                <th>Nome</th>
                <th>Sobrenome</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id = "resultadobody">
        </tbody>
    </table>
</div>

<a href = "../index.html">Voltar</a>

<script src = "../script.js"></script>
<script>
    window.onload = function(){
    pesquisarUsuario();
    };
</script>
</body>
</html>
