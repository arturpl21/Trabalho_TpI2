<!DOCTYPE html>
<html lang= "pt-BR">
<head>
    <meta charset = "UTF-8">
    <meta name = "viewport" content = "width = device-width, initial-scale = 1.0">
    <title>Cadastro de Categoria</title>
    <link rel = "stylesheet" href = "../styles.css">
</head>
<body>
<form>
    <input type = "hidden" id = "cod_edicao">
    <input type = "text" id = "nome" placeholder = "Nome" required>
    <input type = "text" id = "descricao" placeholder = "Descrição">
    <input type = "color" id = "cor">
    <input type = "text" id = "tipo" placeholder = "Tipo">
    <select id = "status">
        <option>Ativo</option>
        <option>Inativo</option>
    </select>
    <input type = "button" id = "btn-cadastrar" onclick = "cadastrarCategoria()" value = "Cadastrar">
    <input type = "button" id = "btn-atualizar" onclick = "atualizarCategoria()" value = "Atualizar"
    style = "display:none">
    <input type = "reset" value = "Limpar">
</form>

<div id = "mensagem-retorno"></div>

<h2>Pesquisar Categorias</h2>

<input type = "text" id = "campo-pesquisa" placeholder = "Digite para pesquisar...">
<input type = "button" onclick = "pesquisarCategoria()" value = "Pesquisar">
 
<div>
    <table id = "resultado" border = "1" style = "margin-top: 10px; width: 300px;">
        <thead>
            <tr>
                <th>Código</th>
                <th>Nome</th>
                <th>Tipo</th>
                <th>Status</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id = "resultadobody"></tbody>
    </table>
</div>

<a href = "../index.html">Voltar</a>

<script src = "../script.js"></script>
<script>
    window.onload = function(){
    pesquisarCategoria();
    };
</script>
</body>
</html>
